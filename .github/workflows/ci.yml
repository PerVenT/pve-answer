name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'ansible/**'
      - '**.md'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'ansible/**'
      - '**.md'
      - '.gitignore'
  schedule:
    # Weekly, for base image updates.
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements_ci.txt

      - name: Run pytest
        run: pytest -v

      - name: Validate compose files
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.dev.yaml config -q

  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      # GHCR requires lowercase; github.repository keeps the owner's case.
      - name: Lowercase the image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      # To build arm64 on this amd64 runner.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By digest only: untagged until the smoke tests pass and publish promotes it.
      - name: Build and push by digest
        if: github.event_name != 'pull_request'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          # Otherwise the digest is an index wrapping the image plus attestations.
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Record digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digest
          echo "${{ steps.build.outputs.digest }}" > /tmp/digest/${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digest/${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

      # Fork tokens cannot push, so PRs build and test locally.
      - name: Build locally (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: pve-answer:pr-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Smoke test (pull request)
        if: github.event_name == 'pull_request'
        run: bash tests/smoke.sh pve-answer:pr-${{ matrix.arch }}

  # ---------------------------------------------------------------------------
  smoke-test:
    name: Smoke test ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      # GHCR requires lowercase; github.repository keeps the owner's case.
      - name: Lowercase the image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digest

      - name: Pull and smoke test the built image
        run: |
          digest="$(cat /tmp/digest/${{ matrix.arch }})"
          image="${REGISTRY}/${IMAGE_NAME}@${digest}"

          echo "Testing $image"

          # Without --platform, a cross-architecture digest fails to resolve.
          docker pull -q --platform "linux/${{ matrix.arch }}" "$image"

          bash tests/smoke.sh "$image"

  # ---------------------------------------------------------------------------
  publish:
    name: Publish manifest
    runs-on: ubuntu-latest
    needs: smoke-test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      # GHCR requires lowercase; github.repository keeps the owner's case.
      - name: Lowercase the image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digest

      # No rebuild: just a manifest list over the tested digests.
      - name: Create the multi-platform manifest
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          refs=""

          for arch in amd64 arm64; do
              digest="$(cat "/tmp/digest/$arch")"
              echo "$arch -> $digest"
              refs="$refs ${image}@${digest}"
          done

          # shellcheck disable=SC2086
          docker buildx imagetools create \
              --tag "${image}:latest" \
              --tag "${image}:sha-${GITHUB_SHA:0:7}" \
              $refs

      - name: Verify the manifest points at the smoke-tested images
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          raw="$(docker buildx imagetools inspect --raw "${image}:latest")"

          for arch in amd64 arm64; do
              tested="$(cat "/tmp/digest/$arch")"
              found="$(echo "$raw" | jq -r --arg a "$arch" \
                  '.manifests[] | select(.platform.architecture == $a) | .digest')"

              if [ "$found" != "$tested" ]; then
                  echo "::error::$arch published as $found, expected $tested"
                  exit 1
              fi

              echo "$arch: $found (the image that passed smoke testing)"
          done

      - name: Show what was published
        run: |
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:latest"
